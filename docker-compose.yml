services:
  gateway:
    build: .
    image: shadow-gateway:latest
    ports:
      - "8000:8000"
    environment:
      PRIMARY_URL: http://primary:8000
      SHADOW_URL: http://shadow:8000
      MAX_SHADOW_CALLS: "4"
      SHADOW_TIMEOUT_S: "2"
      # HMAC 验签密钥: 只存在于服务端环境, 网页/日志/接口均不返回它
      # 生产部署请用真实密钥覆盖, 例如: SIGNING_SECRET=$(openssl rand -hex 32) docker compose up
      SIGNING_SECRET: "${SIGNING_SECRET:-dev-only-signing-secret-change-me}"
      SIGN_WINDOW_S: "60"
      MAX_NONCES: "1024"
    mem_limit: 96m
    mem_reservation: 64m
    depends_on:
      - primary
      - shadow
    command: ["uvicorn", "app.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  primary:
    image: shadow-gateway:latest
    build: .
    environment:
      SERVICE_ROLE: primary
      SERVICE_PORT: "8000"
    command: ["uvicorn", "app.quote_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  shadow:
    image: shadow-gateway:latest
    build: .
    environment:
      SERVICE_ROLE: shadow
      SERVICE_PORT: "8000"
    command: ["uvicorn", "app.quote_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
